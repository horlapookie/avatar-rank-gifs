name: Generate and save rank GIFs
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install Pillow==12.1.1 requests==2.32.5
      - name: Generate and verify 69 separate GIFs
        run: python tools/generate.py
      - name: Save GIFs to the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/save_gifs.py
